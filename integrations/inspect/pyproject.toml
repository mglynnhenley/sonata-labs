[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sonata-inspect"
version = "0.1.0"
description = "Inspect pilot adapter for Sonata business simulations"
requires-python = ">=3.11"
dependencies = ["inspect-ai==0.3.263", "httpx==0.28.1", "mcp>=1.10.0", "openai>=3.1.0,<4", "jsonschema>=4,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.setuptools.packages.find]
include = ["sonata_inspect*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
